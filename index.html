      function setCategory(cat) {
        activeCategory = cat;
        document.getElementById("cat-conferencias").className =
          `flex-1 py-3 px-4 text-center font-bold transition-colors ${cat === "conferencias" ? "cat-active" : "cat-inactive"}`;
        document.getElementById("cat-talleres").className =
          `flex-1 py-3 px-4 text-center font-bold transition-colors ${cat === "talleres" ? "cat-active" : "cat-inactive"}`;
        render();
      }

      function setDay(day) {
        activeDay = day;
        document.getElementById("day-jueves").className =
          `pb-3 px-4 text-sm uppercase tracking-wider ${day === "jueves" ? "day-active" : "day-inactive"}`;
        document.getElementById("day-viernes").className =
          `pb-3 px-4 text-sm uppercase tracking-wider ${day === "viernes" ? "day-active" : "day-inactive"}`;
        render();
      }

      function render() {
        const container = document.getElementById("schedule-container");
        container.innerHTML = "";

        const currentList = data[activeCategory][activeDay];

        currentList.forEach((event) => {
          const color =
            event.type === "conference"
              ? "bg-blue-100 text-blue-800"
              : event.type === "workshop"
                ? "bg-emerald-100 text-emerald-800"
                : event.type === "break"
                  ? "bg-orange-100 text-orange-800"
                  : "bg-gray-100 text-gray-600";

          container.innerHTML += `
                    <div class="p-4 md:p-6 flex flex-col md:flex-row hover:bg-gray-50 fade-in">
                        <div class="md:w-1/4 mb-2 md:mb-0 text-sm font-bold text-gray-500 flex items-center">
                            <span class="bg-gray-200 px-2 py-1 rounded mr-2 text-[10px]">HORA</span> ${event.time}
                        </div>
                        <div class="md:w-3/4 md:pl-6 border-l-0 md:border-l border-gray-200">
                            <h3 class="text-lg font-bold text-gray-800 leading-tight">${event.title}</h3>
                            ${event.speaker ? `<p class="text-blue-700 text-sm font-semibold mt-2">👤 ${event.speaker}</p>` : ""}
                            ${event.location ? `<p class="text-gray-500 text-sm mt-1">📍 ${event.location}</p>` : ""}
                            <div class="mt-3">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${color}">
                                    ${event.type === "workshop" ? "Taller" : event.type === "conference" ? "Conferencia" : "General"}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
        });
      }

      // Cargar vista inicial
      render();
    </script>
  </body>
</html>
